name: CI and Docker Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to Docker Hub
        required: true
        default: false
        type: boolean
      publish_dockerhub:
        description: Publish the image to Docker Hub during a manual run
        required: true
        default: true
        type: boolean
      version:
        description: Image version when publishing manually, without the leading v
        required: false
        type: string
      dockerhub_description:
        description: Update the Docker Hub overview from the README and the GitHub releases
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_REPOSITORY: wilhelmza/ultraglass
  # A version with a hyphen (v3.4.0-rc.1, v3.4.0-beta.2) is a prerelease. Prereleases
  # publish their semver image tag and a GitHub prerelease. Only stable versions move
  # the `latest` image tag and become the latest GitHub release.
  PRERELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && contains(inputs.version, '-')) }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HYPERGLASS_APP_PATH: ${{ github.workspace }}/.hyperglass
      HYPERGLASS_HOST: 127.0.0.1
      HYPERGLASS_PORT: 8001
      HYPERGLASS_REDIS_HOST: 127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.lock

      - name: Prepare application directory
        run: mkdir -p "$HYPERGLASS_APP_PATH"

      - name: Test Python
        run: pytest hyperglass --ignore hyperglass/plugins/external

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyperglass/ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create empty hyperglass.json
        run: printf '{}\n' > hyperglass.json

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint TypeScript
        run: pnpm run lint

      - name: Check TypeScript types
        run: pnpm run typecheck

      - name: Test TypeScript
        run: pnpm run test

  package:
    name: Build Python distributions
    needs:
      - backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel and source distribution
        run: uv build --wheel --sdist

      - name: Verify wheel installation
        run: |
          uv venv /tmp/hyperglass-wheel-test
          uv pip install --python /tmp/hyperglass-wheel-test/bin/python dist/*.whl
          /tmp/hyperglass-wheel-test/bin/hyperglass --help

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  docker:
    name: Build and publish Docker image
    needs:
      - backend
      - frontend
    if: ${{ always() && needs.backend.result == 'success' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate manual release version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: test -n "${{ inputs.version }}"

      - name: Log in to Docker Hub
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.publish_dockerhub) }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_REPOSITORY }}
          labels: |
            org.opencontainers.image.documentation=${{ startsWith(github.ref, 'refs/tags/v') && format('https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) || format('https://github.com/{0}/blob/main/CHANGELOG.md', github.repository) }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.version != '' }}
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}

      - name: Build and publish Docker image
        id: dockerhub
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.publish_dockerhub) }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract GitHub Container Registry metadata
        id: meta-ghcr
        if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wilhelmza/ultraglass
          labels: |
            org.opencontainers.image.documentation=${{ startsWith(github.ref, 'refs/tags/v') && format('https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) || format('https://github.com/{0}/blob/main/CHANGELOG.md', github.repository) }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.version != '' }}
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}

      - name: Build and publish GitHub Container Registry image
        id: ghcr
        if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify release image publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          if [ "${{ steps.dockerhub.outcome }}" != "success" ] && [ "${{ steps.ghcr.outcome }}" != "success" ]; then
            echo "Neither Docker Hub nor GHCR published the release image."
            exit 1
          fi

  release:
    name: Publish GitHub release
    needs:
      - package
      - docker
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Build release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$version" '
            $0 ~ "^## " ver "( |$)" { flag=1; next }
            flag && /^## / { flag=0 }
            flag { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            printf 'Ultraglass %s.\n\nImages: `wilhelmza/ultraglass:%s`, `ghcr.io/wilhelmza/ultraglass:%s`.\n' \
              "$version" "$version" "$version" > "$notes_file"
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            release_type=--prerelease
          else
            release_type=--latest
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            "$release_type" \
            --verify-tag \
            dist/*

  dockerhub-description:
    name: Update Docker Hub overview
    needs:
      - release
    if: ${{ always() && ((startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.dockerhub_description)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the overview from the README and the GitHub releases
        id: overview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="$GITHUB_REPOSITORY"
          raw="https://raw.githubusercontent.com/$repo/main"
          blob="https://github.com/$repo/blob/main"
          out="$RUNNER_TEMP/overview.md"
          # Docker Hub renders the overview without repository context, so relative links become absolute.
          sed -E \
            -e "s#\]\(([^)#:]+\.(svg|png|jpg|gif))\)#](${raw}/\1)#g" \
            -e "s#\]\(([^)#:]+)\)#](${blob}/\1)#g" \
            README.md > "$out"
          latest="$(gh api "repos/$repo/releases/latest" --jq .tag_name)"
          version="${latest#v}"
          {
            printf '\n## Releases\n\n'
            printf 'Latest stable release: **%s**. Pull `%s:%s` or `ghcr.io/%s:%s`. The `latest` tag on both registries points to it.\n\n' "$version" "$DOCKERHUB_REPOSITORY" "$version" "$DOCKERHUB_REPOSITORY" "$version"
            printf 'Every version has release notes on [GitHub Releases](https://github.com/%s/releases) and in the [changelog](%s/CHANGELOG.md). Release candidates are tagged by version, such as `3.4.0-rc.3`, and never move `latest`. Each image carries its release notes link in the `org.opencontainers.image.documentation` label.\n\n' "$repo" "$blob"
            printf '| Version | Date | Notes |\n|---|---|---|\n'
            gh api "repos/$repo/releases?per_page=10" --jq '.[] | select(.draft | not) | "| \(.tag_name | ltrimstr("v")) | \(.published_at[:10]) | [\(if .prerelease then "pre-release notes" else "release notes" end)](\(.html_url)) |"'
            printf '\n## %s release notes\n\n' "$version"
            gh api "repos/$repo/releases/latest" --jq .body
          } >> "$out"
          size="$(wc -c < "$out")"
          if [ "$size" -gt 25000 ]; then
            echo "Overview is $size bytes; Docker Hub allows 25000. Shorten the README or the release notes."
            exit 1
          fi
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Push the overview to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPOSITORY }}
          readme-filepath: ${{ steps.overview.outputs.file }}
