interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet { address 10.250.6.1/31; }
            family inet6 { address fd00:250:6::1/127; }
        }
    }
}
routing-options {
    autonomous-system 65006;
    router-id 10.250.6.1;
    static { route 0.0.0.0/0 next-hop 10.250.6.0; }
    rib inet6.0 { static { route ::/0 next-hop fd00:250:6::; } }
}
protocols {
    bgp {
        group core {
            type external;
            peer-as 65000;
            neighbor 10.250.6.0 { family inet { unicast { add-path { receive; } } } }
        }
        group corev6 {
            type external;
            peer-as 65000;
            neighbor fd00:250:6:: { family inet6 { unicast { add-path { receive; } } } }
        }
    }
}
