hostname {{ .Hostname }}
username admin privilege 15 secret Lab-Router9
ip domain name lab
no ip domain-lookup
ip bgp-community new-format
no service config
no ip http server
no ip http secure-server
ipv6 unicast-routing
vrf definition clab-mgmt
 address-family ipv4
 exit-address-family
 address-family ipv6
 exit-address-family
exit
interface GigabitEthernet0/0
 vrf forwarding clab-mgmt
 ip address {{ .MgmtIPv4Addr }} {{ .MgmtIPv4SubnetMask }}
 no shutdown
exit
interface GigabitEthernet0/1
 ip address 10.251.5.1 255.255.255.254
 ipv6 address fd00:251:5::1/127
 no shutdown
exit
ip route vrf clab-mgmt 0.0.0.0 0.0.0.0 {{ .MgmtIPv4GW }}
router bgp 65025
 bgp router-id 10.251.5.1
 no bgp default ipv4-unicast
 neighbor 10.251.5.0 remote-as 65000
 neighbor 10.251.5.0 shutdown
 neighbor fd00:251:5:: remote-as 65000
 neighbor fd00:251:5:: shutdown
 address-family ipv4
  neighbor 10.251.5.0 activate
 exit-address-family
 address-family ipv6
  neighbor fd00:251:5:: activate
 exit-address-family
exit
crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 logging synchronous
 exec-timeout 0 0
exit
line vty 0 4
 login local
 transport input ssh
exit
end
