 ipv6 address fd00:251:6::1/127
 no shutdown
exit
router bgp 65026
 router-id 10.251.6.1
 address-family ipv4 unicast
 exit
 address-family ipv6 unicast
 exit
 neighbor 10.251.6.0
  remote-as 65000
  shutdown
  address-family ipv4 unicast
  exit
 exit
 neighbor fd00:251:6::
  remote-as 65000
  shutdown
  address-family ipv6 unicast
  exit
 exit
exit
