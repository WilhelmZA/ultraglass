ip vrf LAB
exit
interface ethernet1/1/1
 no switchport
 ip address 10.250.1.1/24
 ipv6 address fd00:250:1::1/64
 no shutdown
exit
interface ethernet1/1/2
 no switchport
 ip vrf forwarding LAB
 ip address 10.250.2.1/24
 ipv6 address fd00:250:2::1/64
 no shutdown
exit
router bgp 65030
 router-id 10.250.1.1
 neighbor 10.250.1.2
  remote-as 65000
  no shutdown
  address-family ipv4 unicast
   activate
  exit
  address-family ipv6 unicast
   activate
  exit
 exit
 vrf LAB
  router-id 10.250.2.1
  neighbor 10.250.2.2
   remote-as 65000
   no shutdown
   address-family ipv4 unicast
    activate
   exit
   address-family ipv6 unicast
    activate
   exit
  exit
 exit
exit
