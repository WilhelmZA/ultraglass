exit all
configure
    system
        name "timos"
        security
            user "admin"
                password "Lab-Router9"
                access console
                console
                    member "administrative"
                exit
            exit
            ssh
                preserve-key
                no server-shutdown
            exit
        exit
    exit
    card 1
        card-type iom-v
        mda 1
            mda-type m20-v
            no shutdown
        exit
        no shutdown
    exit
    port 1/1/1
        ethernet
            mode network
        exit
        no shutdown
    exit
    router
        autonomous-system 65027
        router-id 10.255.7.1
        interface "system"
            address 10.255.7.1/32
            no shutdown
        exit
        interface "probe"
            address 10.251.7.1/31
            port 1/1/1
            ipv6
                address fd00:251:7::1/127
            exit
            no shutdown
        exit
        bgp
            group "LAB4"
                family ipv4
                peer-as 65000
                neighbor 10.251.7.0
                    shutdown
                exit
            exit
            group "LAB6"
                family ipv6
                peer-as 65000
                neighbor fd00:251:7::
                    shutdown
                exit
            exit
            no shutdown
        exit
    exit
exit all
