ip routing
ipv6 unicast-routing
ip bgp-community new-format
interface Ethernet0/1
 no switchport
 ip address 10.250.10.1 255.255.255.254
 ipv6 address fd00:250:10::1/127
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.250.10.0
ipv6 route ::/0 fd00:250:10::
router bgp 65010
 bgp router-id 10.250.10.1
 no bgp default ipv4-unicast
 neighbor 10.250.10.0 remote-as 65000
 neighbor 10.250.10.0 shutdown
 neighbor fd00:250:10:: remote-as 65000
 neighbor fd00:250:10:: shutdown
 address-family ipv4 unicast
  neighbor 10.250.10.0 activate
  neighbor 10.250.10.0 send-community both
  neighbor 10.250.10.0 additional-paths receive
 exit-address-family
 address-family ipv6 unicast
  neighbor fd00:250:10:: activate
  neighbor fd00:250:10:: send-community both
  neighbor fd00:250:10:: additional-paths receive
 exit-address-family
!
