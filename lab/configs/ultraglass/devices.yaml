  # RouterOS 6 appliance (#117). `os_version` selects the RouterOS 6 commands.
  - name: lab-routeros6
    address: 192.168.250.28
    group: MikroTik
    credential:
      username: admin
      password: Lab-Router9
    platform: mikrotik_routeros
    os_version: "6.49.19"
    structured_output: true
    attrs:
      source4: 10.251.8.1
      source6: fd00:251:8::1

  # VRF locations (#50). Arista and FRR hold VRF LAB from their startup configs, with
  # 198.51.100.0/24 and 2001:db8:100::/48 originated into BGP. FRR in a VRF offers BGP
  # queries only.
  - name: lab-arista-vrf
    address: 192.168.250.17
    group: VRF
    credential:
      username: admin
      password: admin
    platform: arista_eos
    vrf: LAB
    structured_output: true
    attrs:
      source4: 192.0.2.100
      source6: 2001:db8:100::1

  - name: lab-frr-vrf
    address: 192.168.250.11
    group: VRF
    credential:
      username: lg
      password: lg
    platform: frr
    vrf: LAB
    structured_output: true
    attrs:
      source4: 10.250.1.1
      source6: fd00:250:1::1
