hostname xrd
username clab
 group root-lr
 group cisco-support
 secret clab@123
!
line default
 transport input ssh
!
interface MgmtEth0/RP0/CPU0/0
!
interface GigabitEthernet0/0/0/0
 ipv4 address 10.251.4.1 255.255.255.254
 ipv6 address fd00:251:4::1/127
 no shutdown
!
router static
 address-family ipv4 unicast
  0.0.0.0/0 MgmtEth0/RP0/CPU0/0 {{ .MgmtIPv4Gateway }}
 !
!
route-policy LAB-IN
 pass
end-policy
!
route-policy LAB-OUT
 drop
end-policy
!
router bgp 65024
 bgp router-id 10.251.4.1
 address-family ipv4 unicast
 !
 address-family ipv6 unicast
 !
 neighbor 10.251.4.0
  remote-as 65000
  shutdown
  address-family ipv4 unicast
   route-policy LAB-IN in
   route-policy LAB-OUT out
  !
 !
 neighbor fd00:251:4::
  remote-as 65000
  shutdown
  address-family ipv6 unicast
   route-policy LAB-IN in
   route-policy LAB-OUT out
  !
 !
!
ssh server v2
end
