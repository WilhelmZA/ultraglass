frr defaults traditional
hostname frr
log stdout
!
! VRF LAB for the VRF lab locations (#50). The topology creates the kernel VRF.
vrf LAB
 ip route 198.51.100.0/24 blackhole
 ipv6 route 2001:db8:100::/48 blackhole
exit-vrf
!
router bgp 65001 vrf LAB
 bgp router-id 10.250.1.1
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:100::/48
 exit-address-family
!
router bgp 65001
 bgp router-id 10.250.1.1
 no bgp ebgp-requires-policy
 neighbor 10.250.1.0 remote-as 65000
 neighbor fd00:250:1:: remote-as 65000
 !
 address-family ipv4 unicast
  no neighbor fd00:250:1:: activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor fd00:250:1:: activate
 exit-address-family
!
! Keep the full table out of the kernel. The default route via the core
! already carries all lab traffic.
route-map NO-FIB deny 10
!
router bgp 65001
 address-family ipv4 unicast
  table-map NO-FIB
 exit-address-family
 address-family ipv6 unicast
  table-map NO-FIB
 exit-address-family
!
