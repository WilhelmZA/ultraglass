hostname arista
!
username admin privilege 15 role network-admin secret admin
!
service routing protocols model multi-agent
!
interface Ethernet1
   no switchport
   ip address 10.250.7.1/31
   ipv6 address fd00:250:7::1/127
!
! VRF LAB for the VRF lab locations (#50).
vrf instance LAB
!
interface Loopback100
   vrf LAB
   ip address 192.0.2.100/32
   ipv6 address 2001:db8:100::1/128
!
ip routing
ip routing vrf LAB
ipv6 unicast-routing
ipv6 unicast-routing vrf LAB
ip route 0.0.0.0/0 10.250.7.0
ip route vrf LAB 198.51.100.0/24 Null0
ipv6 route ::/0 fd00:250:7::
ipv6 route vrf LAB 2001:db8:100::/48 Null0
!
router bgp 65007
   router-id 10.250.7.1
   neighbor 10.250.7.0 remote-as 65000
   neighbor 10.250.7.0 maximum-routes 2000000
   neighbor fd00:250:7:: remote-as 65000
   neighbor fd00:250:7:: maximum-routes 2000000
   !
   address-family ipv4
      neighbor 10.250.7.0 activate
      neighbor 10.250.7.0 maximum-routes 0
   !
   address-family ipv6
      neighbor fd00:250:7:: activate
      neighbor fd00:250:7:: maximum-routes 0
   !
   vrf LAB
      rd 65007:100
      router-id 10.250.7.100
      network 198.51.100.0/24
      network 2001:db8:100::/48
!
management api http-commands
   no shutdown
!
