# Core router. Holds the injected full table and sends it to every device under test.
# Devices: frr 10.250.1.1, bird 10.250.2.1, openbgpd 10.250.3.1, mikrotik 10.250.4.1.
# ADD-PATH send is on for every device except Huawei, so the test prefixes that
# inject-table.sh loads with all paths reach each device with every rrc19 path.
# Peers that do not negotiate ADD-PATH receive still get the best path only.

[global.config]
  as = 65000
  router-id = "10.250.0.1"

[[neighbors]]
  [neighbors.config]
    neighbor-address = "10.250.1.1"
    peer-as = 65001
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv4-unicast"
    [neighbors.afi-safis.add-paths.config]
      send-max = 255
[[neighbors]]
  [neighbors.config]
    neighbor-address = "fd00:250:1::1"
    peer-as = 65001
  [[neighbors.afi-safis]]
    [neighbors.afi-safis.config]
      afi-safi-name = "ipv6-unicast"
    [neighbors.afi-safis.add-paths.config]
      send-max = 255

