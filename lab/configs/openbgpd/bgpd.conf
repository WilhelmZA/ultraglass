AS 65003
router-id 10.250.3.1
# Keep the full table out of the kernel. The default route via the core
# already carries all lab traffic.
fib-update no

neighbor 10.250.3.0 {
    remote-as 65000
    descr "core4"
}
neighbor fd00:250:3:: {
    remote-as 65000
    descr "core6"
}

allow from any
allow to any
